name: Measure
on:
  workflow_dispatch:
    inputs:
      maps:
        type: boolean
        description: Collect the pinned baseline before verification
        default: false
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.maps && 300 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure limited builder
        run: |
          docker buildx create --use --name limited --driver docker-container --driver-opt memory=8g,cpu-period=100000,cpu-quota=400000
      - name: Build collection environment and measure the baseline
        if: inputs.maps
        run: |
          docker buildx build --load --platform linux/amd64 --target tracer -t br-tracer .
          mkdir -m 777 -p scratch/generated
          docker run --rm --cpus 2 --memory 7g --env PYTHON_CPU_COUNT=2 -v "$PWD/scratch/generated:/out" br-tracer
          cp scratch/generated/{maps,case-coverage}.json .
      - uses: actions/upload-artifact@v4
        if: inputs.maps
        with:
          name: baseline-maps
          path: scratch/generated/*.json
      - name: Verify entry
        if: hashFiles('tools/verify.sh') != ''
        run: bash tools/verify.sh
